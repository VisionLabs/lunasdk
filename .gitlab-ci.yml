variables:
# ------------------ GLOBAL VARS ------------------
  GIT_SUBMODULE_STRATEGY: recursive
# ------------------ ROOT DIRS ------------------
  ROOT_DIR: ${CI_PROJECT_DIR}
  LUNA_SDK_ARCH: plans_platform
  FSDK_ROOT: /opt/sdk/luna-sdk-ci
  RELEASE_PORTAL: http://release-portal.vlabs
  DOWNLOAD_PATH: '/opt/sdk'
  SYMLINK_FSDK: ${FSDK_ROOT}

# ------------------ DECLARE STAGES ------------------

# LUNA-8410: override of the shared template .extract_luna_sdk_tag. The lock
# now pins the batch-warp bindings wheel (faceengine-test-8410) instead of the
# plain faceengine package, which the template awk does not find.
.extract_luna_sdk_tag: &extract_luna_sdk_tag
  # Extracts sdk tag from poetry.lock file (faceengine / faceengine-test-*)
  - |
    set -x
    LOCK_PATH="${CI_PROJECT_DIR:-.}/poetry.lock"
    if [ -n "$LOCK_FILE_DIR" ]; then
      LOCK_PATH="${LOCK_FILE_DIR}/poetry.lock"
    fi
    full_version=$(awk '
      $1 == "name" && $3 ~ /"faceengine/ { found=1 }
      found && $1 == "version" {
        gsub(/"/, "", $3);
        print $3;
        exit
      }
    ' ${LOCK_PATH})

    if [ -z "$full_version" ]; then
      echo "SDK version not found in poetry.lock file"
      exit 1
    fi
    version=$(echo "$full_version" | awk -F. '{ if (NF>3) print $1"."$2"."$3; else print $0 }')
    export LUNA_SDK_TAG="v.${version}"

include:
  - project: 'common/pypi-template'
    ref: master
    file: 'public_pypi.yml'
  - project: 'luna/ci-templates'
    ref: python312
    file:
      - '/.python-builder-image.yml'
      - '/.formatters.yml'
      - '/.download_fsdk.yml'
      - '/.additions.yml'
      - template.gitlab-ci.yml

stages:
  - build
  - test
  - validate

.build:artifact: &build_artifact
  artifacts:
    name: "luna-sdk-loop"
    expire_in: "30 min"
    paths:
      - ${CI_PROJECT_DIR}/tests/test_benchmark/logs

.use_cpusdk: &use_cpusdk
  sed -i 's/name = "lunavl"/name = "lunavlcpu"/' pyproject.toml;
  sed -i 's/FaceEngine =/FaceEngineCPU =/' pyproject.toml;
  echo $'\n[[tool.poetry.packages]] \ninclude = "lunavl"' >> pyproject.toml;

.run_unittests: &run_unittests
  python -m pytest;

build:pypi:
  stage: build
  tags: ['k8s-python']
  image: ${BUILDER_IMAGE}
  extends: .build_python_package

build:to_public_pypi:
  stage: build
  tags: ['k8s-python']
  image: ${BUILDER_IMAGE}
  extends: [.publish_to_public_pypi, .run_tag]

build_cpu:pypi:
  stage: build
  tags: ['k8s-python']
  image: ${BUILDER_IMAGE}
  before_script:
    - *use_cpusdk
  extends: .build_python_package

mypy:storages:
  stage: build
  tags: [ 'luna-bench' ]
  script:
    - poetry env use python3.12
    - !reference [.prepare_poetry]
    - poetry run mypy ${CI_PROJECT_DIR}/lunavl/
  allow_failure: true

forrmaters:
  stage: validate
  extends: .code_style_formatters

test:unittests:
  stage: test
  tags: [ 'luna-bench' ]
  script:
    - !reference [.extract_luna_sdk_tag]
    - !reference [.download_plans]
    - poetry env use python3.12
    - !reference [.prepare_poetry]
    - source $(poetry env info -p)/bin/activate
    - *run_unittests

